<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Branch Proximity Finder</title>
  <link rel="icon" type="image/png" href="global/favicon.png">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>Multi-Branch Proximity Finder</h1>
        <p>Dynamic inputs with live autocomplete and route selection sync.</p>
      </header>

      <div class="sidebar-scrollable-area">

      <section class="panel" aria-label="Origin and destination inputs">
        <div class="sticky-origin-controls">
          <label for="originInput">Origin</label>
          <div class="autocomplete-wrap">
            <input
              id="originInput"
              type="text"
              placeholder="Type place, address, or coordinates"
              autocomplete="off"
            />
            <div id="originAutocomplete" class="autocomplete-dropdown hidden"></div>
          </div>

          <div class="origin-tools">
            <button id="useLocationBtn" type="button" class="secondary-btn">Use My Location</button>
            <button id="pickOnMapBtn" type="button" class="secondary-btn">Pick on Map</button>
          </div>
          <p id="originError" class="field-error" role="alert"></p>

          <div class="actions sticky-calc-actions">
            <button id="calculateBtn" type="button" class="primary-btn">Calculate & Sort</button>
            <button id="clearBtn" type="button" class="ghost-btn">Clear Map</button>
          </div>
        </div>

        <div id="destination-inputs">
          <label>Destinations</label>
          <div id="destinationRows" class="destination-rows"></div>
          <div class="destination-actions-row">
            <button id="addDestinationBtn" type="button" class="secondary-btn add-destination-btn">+ Add Destination</button>
            <button id="favoriteBtn" type="button" class="secondary-btn favorite-btn" aria-haspopup="true" aria-expanded="false">
              <i class="fa-solid fa-heart" aria-hidden="true"></i>
              Favorite
            </button>
          </div>
          <div id="favoriteDropdown" class="favorite-dropdown hidden" role="menu" aria-label="Favorite locations"></div>

          <p id="destinationsError" class="field-error" role="alert"></p>
          <ul id="destinationsErrorList" class="field-error-list" aria-live="polite"></ul>
        </div>

        <p id="statusText" class="status" role="status" aria-live="polite">
          <span id="loadingIndicator" class="loading hidden" aria-hidden="true"></span>
          <span id="statusMessage"></span>
        </p>
      </section>

      <div id="results-container">
        <section class="results" aria-label="Sorted destination results">
          <div class="results-header">
            <h2>Closest to Furthest</h2>
            <span id="resultCount" class="result-count">0 results</span>
          </div>
          <ul id="resultsList" class="results-list"></ul>
        </section>
      </div>

      </div>
    </aside>

    <main class="map-wrap" aria-label="Map view">
      <div id="map" role="application" aria-label="Interactive destination map"></div>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
